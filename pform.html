<!DOCTYPE html>
<html>
<head>
<title>form</title>
</head>
<style>
body{
	width: 100%;
	height: 90vh;
	display: flex;
	justify-content: space-around;
	align-items: center;
    background-color:Gray;
	background-position: center;
	background-size: cover;
}





</style>
<body>
 <form action="action_page.php" method="POST">
<div>
<label for="fname">first name:</label>
<input type="text" id="fname" name="fname" placeholder="Spongebob" required>
</div>
<br>
<div>
<label for="lname">last name:</label>
<input type="text" id="lname" name="lname" placeholder="Squarepants" required>
</div>
<br>
<div>
<label for="pass">password:</label>
<input type="password" id="pass" name="pass" maxlength="12" required> </div>
 <br>
<div>
<label for="email">email:</label>

<input type="email" id="email" name="email" placeholder="SSPants@gmail.com">
 </div>
<br>
 <div>
<label for="phone">phone :</label>
<input type="tel" id="phone" name="phone" placeholder="(+880)">
</div>
 <br>
<div>
 <label for="bdate">birthdate:</label>
<input type="date" id="bdate" name="bdate">
</div>
 <br>
<label for="title">title:</label>
<label for="male">Male</label>
 <input type="radio" id="male" name="title" value="male">
<label for="female">Female</label>
<input type="radio" id="female" name="title" value="female">


<br>
 <div>
 <input type="reset">
</div>
<br>
<div>
<input type="submit" value="Sign Up!">

</div>
</form>
</body>
</html>
