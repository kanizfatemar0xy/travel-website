<head>
<title>My first website</title>

<body>
 <form action="action_page.php" method="POST">
<div>
<label for="fname">first name:</label>
<input type="text" id="fname" name="fname" placeholder="Kaniz" required>
</div>
<br>
<div>
<label for="lname">last name:</label>
<input type="text" id="lname" name="lname" placeholder="Fatema" required>
</div>
<br>
<div>
<label for="pass">password:</label>
<input type="password" id="pass" name="pass" maxlength="12" required>
 </div>
 <br>
<div>
<label for="email">email:</label>

<input type="email" id="email" name="email" placeholder="SPants@gmail.com">
 </div>
<br>
 <div>
<label for="phone">phone #:</label>
<input type="tel" id="phone" name="phone" placeholder="(123)-456-7890">
</div>
 <br>
<div>
 <label for="bdate">birthdate:</label>
<input type="date" id="bdate" name="bdate">
</div>
 <br>
 <label for="title">title:</label>

 <input type="radio" id="male" name="title" value="male">
<label for="female">Female</label>
<input type="radio" id="female" name="title" value="female">
<br>
<div>
<input type="reset"></div>
<br>
<div>
<input type="submit">
 </div>
</form>
